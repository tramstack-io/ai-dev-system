<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feature card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="demo">
      <h1 class="demo__title">Feature card</h1>

      <ul class="demo__grid" role="list">
        <li>
          <article class="feature-card">
            <div class="feature-card__icon" aria-hidden="true">
              <svg class="feature-card__icon-svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
              </svg>
            </div>
            <h2 class="feature-card__heading">Fast</h2>
            <p class="feature-card__description">
              Optimised assets and a lean markup path keep first paint quick without sacrificing clarity.
            </p>
            <a class="feature-card__cta" href="#details-fast">Learn more</a>
          </article>
        </li>
        <li>
          <article class="feature-card">
            <div class="feature-card__icon" aria-hidden="true">
              <svg class="feature-card__icon-svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
            </div>
            <h2 class="feature-card__heading">Accessible structure</h2>
            <p class="feature-card__description">
              Semantic regions and predictable focus order help everyone navigate the interface confidently.
            </p>
          </article>
        </li>
        
      </ul>
    </main>
  </body>
</html>
